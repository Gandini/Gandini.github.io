<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diniworks</title>
<meta name="description" content="Diniworks makes small, friendly puzzle games for Android.">
<style>
  :root { --bg: #fdf6e3; --fg: #2b2418; --muted: #6b5d45; --accent: #b7791f; --rule: #e6d9b8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d1a14; --fg: #efe6d2; --muted: #b5a789; --accent: #f0b84a; --rule: #3a3326; }
  }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 42rem; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.8rem; line-height: 1.2; margin: 0 0 4px; }
  h2 { font-size: 1.2rem; margin: 2rem 0 0.4rem; padding-top: 1rem; border-top: 1px solid var(--rule); }
  p, ul { margin: 0.4rem 0; }
  ul { padding-left: 1.3rem; }
  a { color: var(--accent); overflow-wrap: anywhere; }
  .meta { color: var(--muted); margin: 0 0 1.2rem; }
</style>
</head>
<body>
<main>
<h1>Diniworks</h1>
<p class="meta">Small, friendly puzzle games for Android.</p>

<h2>Beedoku: Buzzy Logic</h2>
<p>A cozy logic puzzle: place one bee in every row, column and flower bed, and keep the bees from touching.</p>
<ul>
  <li><a href="beedoku-privacy/">Privacy policy</a></li>
</ul>

<h2>Contact</h2>
<p>Questions or problems: <a href="mailto:business.diniworks@gmail.com">business.diniworks@gmail.com</a></p>
</main>
</body>
</html>
